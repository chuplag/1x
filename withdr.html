<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Transaction Manager - 1xPartners</title>
    <link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@400;500;600;700;800&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            background: #0a0c12;
            font-family: 'Exo 2', sans-serif;
            color: #e8eaf0;
            padding-bottom: 70px;
        }
        /* Top Bar */
        .app-top-bar {
            background: #121520;
            padding: 14px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #252a3a;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .user-name { font-weight: 700; font-size: 18px; color: #f5a623; }
        .aff-id { font-size: 12px; color: #9095aa; margin-top: 4px; }
        .icon-btn { background: none; border: none; font-size: 20px; cursor: pointer; color: #9095aa; }
        
        /* Main Content */
        .main { padding: 20px; max-width: 1400px; margin: 0 auto; }
        
        /* Cards */
        .card {
            background: #121520;
            border: 1px solid #252a3a;
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 24px;
        }
        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            flex-wrap: wrap;
            gap: 12px;
        }
        h2, h3 { font-family: 'Exo 2', sans-serif; font-weight: 600; }
        
        /* Form elements */
        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 16px;
            margin-bottom: 20px;
        }
        .form-group { display: flex; flex-direction: column; gap: 6px; }
        .form-label {
            font-size: 11px;
            text-transform: uppercase;
            font-weight: 600;
            color: #9095aa;
            letter-spacing: 0.5px;
        }
        .form-input, .form-select {
            background: #0a0c12;
            border: 1px solid #252a3a;
            border-radius: 10px;
            padding: 10px 14px;
            color: #e8eaf0;
            font-family: inherit;
            font-size: 14px;
        }
        .form-input:focus, .form-select:focus {
            outline: none;
            border-color: #f5a623;
        }
        
        /* Buttons */
        .btn {
            padding: 10px 20px;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            border: none;
            transition: 0.2s;
        }
        .btn-primary { background: #f5a623; color: #0a0c12; }
        .btn-outline { background: transparent; border: 1px solid #252a3a; color: #9095aa; }
        
        /* Filter bar */
        .filter-bar {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 20px;
            align-items: flex-end;
        }
        .filter-group { flex: 1; min-width: 150px; }
        
        /* Table */
        .table-responsive { overflow-x: auto; -webkit-overflow-scrolling: touch; }
        table { width: 100%; border-collapse: collapse; min-width: 800px; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #252a3a; }
        th { background: rgba(255,255,255,0.03); font-size: 12px; text-transform: uppercase; color: #9095aa; }
        tr:hover { background: rgba(255,255,255,0.02); }
        .status-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
        }
        .status-success { background: rgba(34,197,94,0.15); color: #22c55e; }
        .status-pending { background: rgba(245,166,35,0.15); color: #f5a623; }
        .status-failed { background: rgba(239,68,68,0.15); color: #ef4444; }
        
        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.8);
            z-index: 2000;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .modal.active { display: flex; }
        .modal-content {
            background: #121520;
            border-radius: 20px;
            max-width: 600px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            border: 1px solid #252a3a;
        }
        .modal-header { padding: 20px; border-bottom: 1px solid #252a3a; display: flex; justify-content: space-between; align-items: center; }
        .modal-body { padding: 20px; }
        .modal-footer { padding: 16px 20px; border-top: 1px solid #252a3a; display: flex; justify-content: flex-end; gap: 12px; }
        
        /* Bottom Navigation */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: #121520;
            display: flex;
            justify-content: space-around;
            padding: 10px 0 16px;
            border-top: 1px solid #252a3a;
            z-index: 100;
        }
        .bottom-nav .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-decoration: none;
            color: #9095aa;
            font-size: 11px;
            gap: 4px;
        }
        .bottom-nav .nav-item.active { color: #f5a623; }
        .nav-icon { font-size: 22px; }
        
        @media (max-width: 768px) {
            .main { padding: 16px; }
            .filter-bar { flex-direction: column; }
        }
    </style>
</head>
<body>
<div class="main">
    <!-- Alert Banner -->
    <div class="card" style="background: rgba(239,68,68,0.1); border-color: rgba(239,68,68,0.3);">
        <div style="display: flex; align-items: center; gap: 12px;">
            <span style="font-size: 24px;">⚠️</span>
            <div><strong>Withdrawal Issue Detected</strong> — You can search, edit, or update any transaction below.</div>
        </div>
    </div>
    
    <!-- Add New Transaction -->
    <div class="card">
        <div class="card-header"><h3>➕ Add New Transaction</h3></div>
        <div class="form-grid">
            <div class="form-group"><label class="form-label">Player ID</label><input type="number" id="newPlayerId" class="form-input" placeholder="e.g., 1621151391"></div>
            <div class="form-group"><label class="form-label">Amount (NPR)</label><input type="number" id="newAmount" class="form-input" placeholder="e.g., 1000"></div>
            <div class="form-group"><label class="form-label">Type</label><select id="newType" class="form-select"><option>Deposit</option><option>Withdrawal</option></select></div>
            <div class="form-group"><label class="form-label">Method</label><select id="newMethod" class="form-select"><option>eSewa</option><option>Khalti</option><option>ConnectIPS</option><option>Bank Transfer</option></select></div>
            <div class="form-group"><label class="form-label">Status</label><select id="newStatus" class="form-select"><option>SUCCESS</option><option>PENDING</option><option>FAILED</option></select></div>
            <div class="form-group"><label class="form-label">Agent</label><select id="newAgentId" class="form-select"></select></div>
        </div>
        <button class="btn btn-primary" id="addTransactionBtn">➕ Record Transaction</button>
    </div>
    
    <!-- Search Filters -->
    <div class="card">
        <div class="card-header"><h3>🔍 Search & Filter Transactions</h3></div>
        <div class="filter-bar">
            <div class="filter-group"><label class="form-label">Player ID</label><input type="text" id="searchPlayerId" class="form-input" placeholder="Player ID"></div>
            <div class="filter-group"><label class="form-label">Transaction ID</label><input type="text" id="searchTxId" class="form-input" placeholder="TX..."></div>
            <div class="filter-group"><label class="form-label">Type</label><select id="searchType" class="form-select"><option value="">All</option><option>Deposit</option><option>Withdrawal</option></select></div>
            <div class="filter-group"><label class="form-label">Status</label><select id="searchStatus" class="form-select"><option value="">All</option><option>SUCCESS</option><option>PENDING</option><option>FAILED</option></select></div>
            <div class="filter-group"><label class="form-label">From Date</label><input type="date" id="searchDateFrom" class="form-input"></div>
            <div class="filter-group"><label class="form-label">To Date</label><input type="date" id="searchDateTo" class="form-input"></div>
            <div class="filter-group"><button class="btn btn-primary" id="searchBtn">🔍 Search</button><button class="btn btn-outline" id="resetBtn" style="margin-left:8px">Reset</button></div>
        </div>
    </div>
    
    <!-- Transactions Table -->
    <div class="card">
        <div class="card-header"><h3>📋 All Transactions</h3><span id="recordCount"></span></div>
        <div class="table-responsive">
            <table id="transactionsTable">
                <thead>
                    <tr><th>Timestamp</th><th>Player ID</th><th>Amount</th><th>Type</th><th>Method</th><th>Status</th><th>Transaction ID</th><th>Agent</th><th>Actions</th></tr>
                </thead>
                <tbody id="tableBody"><tr><td colspan="9" style="text-align:center; padding:40px;">Loading transactions...</td></tr></tbody>
            </table>
        </div>
    </div>
</div>

<!-- Edit Modal -->
<div id="editModal" class="modal">
    <div class="modal-content">
        <div class="modal-header"><h3>✏️ Edit Transaction</h3><button class="btn btn-outline" onclick="closeEditModal()">✕</button></div>
        <div class="modal-body">
            <input type="hidden" id="editTxId">
            <div class="form-group"><label class="form-label">Player ID</label><input type="text" id="editPlayerId" class="form-input"></div>
            <div class="form-group"><label class="form-label">Amount (NPR)</label><input type="number" id="editAmount" class="form-input"></div>
            <div class="form-group"><label class="form-label">Type</label><select id="editType" class="form-select"><option>Deposit</option><option>Withdrawal</option></select></div>
            <div class="form-group"><label class="form-label">Method</label><select id="editMethod" class="form-select"><option>eSewa</option><option>Khalti</option><option>ConnectIPS</option><option>Bank Transfer</option></select></div>
            <div class="form-group"><label class="form-label">Status</label><select id="editStatus" class="form-select"><option>SUCCESS</option><option>PENDING</option><option>FAILED</option></select></div>
            <div class="form-group"><label class="form-label">Transaction Date</label><input type="datetime-local" id="editTimestamp" class="form-input"></div>
        </div>
        <div class="modal-footer"><button class="btn btn-outline" onclick="closeEditModal()">Cancel</button><button class="btn btn-primary" id="saveEditBtn">Save Changes</button></div>
    </div>
</div>

<script src="data-manager.js"></script>
<script src="nav.js"></script>
<script>
    let allTransactions = [];
    let agents = [];
    
    async function loadAgents() {
        agents = await getAgents();
        const agentSelect = document.getElementById('newAgentId');
        if (agents.length) {
            agentSelect.innerHTML = agents.map(a => `<option value="${a.id}">${a.name}</option>`).join('');
        } else {
            agentSelect.innerHTML = '<option value="">No agents</option>';
        }
    }
    
    async function loadTransactions() {
        allTransactions = await getTransactions();
        applyFilters();
    }
    
    function applyFilters() {
        const playerId = document.getElementById('searchPlayerId').value.trim();
        const txId = document.getElementById('searchTxId').value.trim();
        const type = document.getElementById('searchType').value;
        const status = document.getElementById('searchStatus').value;
        const fromDate = document.getElementById('searchDateFrom').value;
        const toDate = document.getElementById('searchDateTo').value;
        
        let filtered = [...allTransactions];
        if (playerId) filtered = filtered.filter(t => t.playerId && t.playerId.toString().includes(playerId));
        if (txId) filtered = filtered.filter(t => t.txId && t.txId.toLowerCase().includes(txId.toLowerCase()));
        if (type) filtered = filtered.filter(t => t.type === type);
        if (status) filtered = filtered.filter(t => t.status === status);
        if (fromDate) filtered = filtered.filter(t => new Date(t.timestamp) >= new Date(fromDate));
        if (toDate) filtered = filtered.filter(t => new Date(t.timestamp) <= new Date(toDate));
        
        renderTable(filtered);
        document.getElementById('recordCount').innerText = `${filtered.length} records`;
    }
    
    function renderTable(transactions) {
        const tbody = document.getElementById('tableBody');
        const agentMap = new Map(agents.map(a => [a.id, a.name]));
        if (!transactions.length) {
            tbody.innerHTML = '<tr><td colspan="9" style="text-align:center; padding:40px;">No transactions found</td></tr>';
            return;
        }
        tbody.innerHTML = transactions.slice(0, 200).map(tx => `
            <tr>
                <td>${formatDateTime(tx.timestamp)}</td>
                <td>${tx.playerId || '-'}</td>
                <td style="color:${tx.type === 'Deposit' ? '#22c55e' : '#f5a623'}; font-weight:600">रु ${tx.amount.toLocaleString('en-IN')}</td>
                <td>${tx.type}</td>
                <td>${tx.method || '-'}</td>
                <td><span class="status-badge status-${tx.status.toLowerCase()}">${tx.status}</span></td>
                <td style="font-family:monospace; font-size:11px">${tx.txId || '-'}</td>
                <td>${agentMap.get(tx.agentId) || 'N/A'}</td>
                <td>
                    <button class="btn btn-outline" style="padding:4px 8px" onclick="openEditModal(${tx.id})">✏️</button>
                    <button class="btn btn-outline" style="padding:4px 8px; margin-left:4px" onclick="deleteTx(${tx.id})">🗑️</button>
                 </td>
            </tr>
        `).join('');
    }
    
    function formatDateTime(iso) {
        if (!iso) return '-';
        const d = new Date(iso);
        return d.toLocaleString('en-GB', { day:'2-digit', month:'short', hour:'2-digit', minute:'2-digit' });
    }
    
    // Add Transaction
    async function addTransaction() {
        const playerId = document.getElementById('newPlayerId').value.trim();
        const amount = parseFloat(document.getElementById('newAmount').value);
        const type = document.getElementById('newType').value;
        const method = document.getElementById('newMethod').value;
        const status = document.getElementById('newStatus').value;
        const agentId = parseInt(document.getElementById('newAgentId').value);
        
        if (!playerId || isNaN(amount) || amount <= 0 || !agentId) {
            alert('❌ Please fill all fields: Player ID, Amount, and Agent');
            return;
        }
        if (amount > 70000) { alert('Amount cannot exceed 70,000 NPR'); return; }
        
        const txId = 'TX' + Math.random().toString(36).substring(2, 10).toUpperCase();
        await addTransaction({
            playerId, amount, type, method, status,
            agentId, timestamp: new Date().toISOString(), txId
        });
        alert(`✅ ${type} of रु ${amount.toLocaleString('en-IN')} recorded!`);
        document.getElementById('newPlayerId').value = '';
        document.getElementById('newAmount').value = '';
        await loadTransactions();
    }
    
    // Edit Modal
    let currentEditId = null;
    function openEditModal(id) {
        const tx = allTransactions.find(t => t.id === id);
        if (!tx) return;
        currentEditId = id;
        document.getElementById('editPlayerId').value = tx.playerId || '';
        document.getElementById('editAmount').value = tx.amount;
        document.getElementById('editType').value = tx.type;
        document.getElementById('editMethod').value = tx.method || 'eSewa';
        document.getElementById('editStatus').value = tx.status;
        const dt = new Date(tx.timestamp);
        const localDt = dt.toISOString().slice(0, 16);
        document.getElementById('editTimestamp').value = localDt;
        document.getElementById('editModal').classList.add('active');
    }
    
    async function saveEdit() {
        const newPlayerId = document.getElementById('editPlayerId').value.trim();
        const newAmount = parseFloat(document.getElementById('editAmount').value);
        const newType = document.getElementById('editType').value;
        const newMethod = document.getElementById('editMethod').value;
        const newStatus = document.getElementById('editStatus').value;
        const newTimestamp = document.getElementById('editTimestamp').value;
        
        if (!newPlayerId || isNaN(newAmount) || newAmount <= 0) {
            alert('Invalid player ID or amount');
            return;
        }
        
        await updateTransaction(currentEditId, {
            playerId: newPlayerId,
            amount: newAmount,
            type: newType,
            method: newMethod,
            status: newStatus,
            timestamp: new Date(newTimestamp).toISOString()
        });
        closeEditModal();
        await loadTransactions();
        alert('Transaction updated successfully');
    }
    
    async function deleteTx(id) {
        if (confirm('Are you sure you want to delete this transaction?')) {
            await deleteTransaction(id);
            await loadTransactions();
            alert('Deleted');
        }
    }
    
    function closeEditModal() {
        document.getElementById('editModal').classList.remove('active');
        currentEditId = null;
    }
    
    // Event listeners
    document.getElementById('addTransactionBtn').addEventListener('click', addTransaction);
    document.getElementById('searchBtn').addEventListener('click', applyFilters);
    document.getElementById('resetBtn').addEventListener('click', () => {
        document.getElementById('searchPlayerId').value = '';
        document.getElementById('searchTxId').value = '';
        document.getElementById('searchType').value = '';
        document.getElementById('searchStatus').value = '';
        document.getElementById('searchDateFrom').value = '';
        document.getElementById('searchDateTo').value = '';
        applyFilters();
    });
    document.getElementById('saveEditBtn').addEventListener('click', saveEdit);
    
    // Initialization
    (async function() {
        requireAuth();
        await initDB();
        await generateDemoData();
        await loadAgents();
        await loadTransactions();
        initNav();   // this creates top bar + bottom nav
    })();
</script>
</body>
</html>
