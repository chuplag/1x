<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Withdrawal Problem - 1xPartners</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        :root { --bg:#0f1117; --card:#1a1f2e; --border:#252b3b; --accent:#ef4444; --text:#e2e8f0; --muted:#7a8599; }
        body { background:var(--bg); font-family:'Roboto', sans-serif; color:var(--text); display:flex; min-height:100vh; position:relative; }
        .sidebar { width:260px; background:#161a24; border-right:1px solid var(--border); transition:transform 0.3s; z-index:1000; }
        .logo { padding:18px 20px; border-bottom:1px solid var(--border); font-size:22px; font-weight:800; color:#ff6b1a; }
        .nav-item { display:flex; align-items:center; gap:12px; padding:10px 20px; color:var(--muted); text-decoration:none; }
        .mobile-header { display:none; background:var(--card); padding:12px 16px; justify-content:space-between; position:sticky; top:0; }
        .hamburger { background:none; border:none; color:var(--text); font-size:26px; cursor:pointer; }
        .overlay { position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.7); z-index:998; display:none; }
        .main { flex:1; padding:24px; }
        .alert-banner { background:rgba(239,68,68,.1); border:1px solid rgba(239,68,68,.3); border-radius:12px; padding:16px; margin-bottom:24px; }
        .search-section { background:var(--card); border-radius:12px; padding:20px; margin-bottom:24px; }
        .search-row { display:flex; gap:12px; flex-wrap:wrap; }
        .search-input { flex:1; padding:12px; background:var(--bg); border:1px solid var(--border); border-radius:8px; color:white; }
        .btn { background:#1a73e8; border:none; padding:12px 24px; border-radius:8px; color:white; cursor:pointer; }
        .result-card { background:var(--card); border-radius:12px; padding:20px; margin-bottom:24px; display:none; }
        table { width:100%; border-collapse:collapse; }
        th, td { padding:12px; text-align:left; border-bottom:1px solid var(--border); }
        @media (max-width:768px) {
            .sidebar { position:fixed; left:0; top:0; height:100%; transform:translateX(-100%); width:260px; }
            .sidebar.open { transform:translateX(0); }
            .mobile-header { display:flex; }
            .main { width:100%; padding:16px; }
        }
    </style>
</head>
<body>
<div class="main">
    <div class="alert-banner">⚠️ Withdrawal Issue Detected – Some transactions are blocked. Search by Player ID or Transaction ID.</div>
    <div class="search-section">
        <div class="search-row">
            <input type="text" id="searchInput" class="search-input" placeholder="Enter Player ID or Transaction ID">
            <button class="btn" onclick="doSearch()">Search</button>
        </div>
    </div>
    <div class="result-card" id="resultCard">
        <h3>Transaction Details</h3>
        <p><strong>Player ID:</strong> <span id="resPlayerId"></span></p>
        <p><strong>Amount:</strong> <span id="resAmount"></span></p>
        <p><strong>Status:</strong> <span style="color:#ef4444">BLOCKED</span></p>
        <p><strong>Reason:</strong> Verification mismatch – please contact support.</p>
    </div>
    <div class="table-responsive"><table><thead><tr><th>Player ID</th><th>Tx ID</th><th>Amount</th><th>Status</th></tr></thead><tbody id="tableBody"></tbody></table></div>
</div>
<script src="data-manager.js"></script>
<script src="nav.js"></script>
<script>
    requireAuth();
    const problemTxs = [
        { player: '1621151391', tx: 'TX7F3A9B2C', amount: 1700, status: 'Blocked' },
        { player: '4092283745', tx: 'TX8D1E4F5A', amount: 2500, status: 'Blocked' },
        { player: '8823410922', tx: 'TX2C6B8E9F', amount: 850, status: 'Pending' }
    ];
    const tbody = document.getElementById('tableBody');
    tbody.innerHTML = problemTxs.map(t => `<tr><td>${t.player}</td><td>${t.tx}</td><td>रु ${t.amount.toLocaleString('en-IN')}</td><td style="color:#ef4444">${t.status}</td></tr>`).join('');
    window.doSearch = function() {
        const val = document.getElementById('searchInput').value.trim();
        const found = problemTxs.find(t => t.player === val || t.tx === val);
        if (found) {
            document.getElementById('resPlayerId').innerText = found.player;
            document.getElementById('resAmount').innerText = 'रु '+found.amount.toLocaleString('en-IN');
            document.getElementById('resultCard').style.display = 'block';
        } else alert('No matching transaction found');
    };
    initNav();
</script>
</body>
</html>
