<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>1xPartners | Secure Login</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0a0c12;
            font-family: 'Exo 2', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .login-card {
            background: #121520;
            border: 1px solid #252a3a;
            border-radius: 28px;
            padding: 40px 32px;
            max-width: 440px;
            width: 100%;
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.6);
            border-top: 4px solid #f5a623;
        }
        .logo {
            font-family: 'Rajdhani', sans-serif;
            font-size: 34px;
            font-weight: 800;
            color: #f5a623;
            text-align: center;
            margin-bottom: 32px;
            letter-spacing: 2px;
        }
        .logo span { color: white; }
        .input-group { margin-bottom: 22px; }
        .input-label {
            display: block;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            color: #9095aa;
            margin-bottom: 6px;
            letter-spacing: 0.8px;
        }
        .login-input {
            width: 100%;
            background: #0a0c12;
            border: 1px solid #252a3a;
            border-radius: 14px;
            padding: 14px 18px;
            color: white;
            font-size: 15px;
            font-family: inherit;
            transition: all 0.2s;
        }
        .login-input:focus { outline: none; border-color: #f5a623; }
        .login-btn {
            width: 100%;
            background: #f5a623;
            color: #0a0c12;
            border: none;
            border-radius: 14px;
            padding: 14px;
            font-weight: 700;
            font-size: 16px;
            cursor: pointer;
            margin-top: 10px;
            transition: all 0.2s;
        }
        .login-btn:hover { background: #e69500; transform: scale(0.98); }
        .error-msg {
            color: #ef4444;
            font-size: 13px;
            text-align: center;
            margin-top: 18px;
            display: none;
        }
        hr { border-color: #252a3a; margin: 28px 0 18px; }
        .info-text { font-size: 12px; color: #5a6288; text-align: center; line-height: 1.5; }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="logo">1x<span>PARTNERS</span></div>
        <div>
            <div class="input-group">
                <label class="input-label">Username</label>
                <input type="text" id="username" class="login-input" placeholder="Enter your username">
            </div>
            <div class="input-group">
                <label class="input-label">Password</label>
                <input type="password" id="password" class="login-input" placeholder="••••••••">
            </div>
            <button class="login-btn" id="loginBtn">AUTHORIZE LOGIN</button>
            <div id="errorMsg" class="error-msg">ACCESS DENIED: Invalid credentials</div>
            <hr>
            <div class="info-text">
                🔹 Partner Demo: <strong>prasanna</strong> / root@knocker<br>
                🔸 Admin Demo: <strong>knocker</strong> / Knocker99@
            </div>
        </div>
    </div>

    <script>
        const loginBtn = document.getElementById('loginBtn');
        const errorMsg = document.getElementById('errorMsg');

        function doLogin() {
            const user = document.getElementById('username').value.trim();
            const pass = document.getElementById('password').value.trim();

            if ((user === 'prasanna' && pass === 'root@knocker') || (user === 'knocker' && pass === 'Knocker99@')) {
                localStorage.setItem('1xpartners_session', btoa(user + ':' + pass));
                localStorage.setItem('1xpartners_user', user);
                window.location.href = '1xpartners-dashboard.html';
            } else {
                errorMsg.style.display = 'block';
                setTimeout(() => errorMsg.style.display = 'none', 2500);
            }
        }

        loginBtn.addEventListener('click', doLogin);
        window.addEventListener('keypress', (e) => { if (e.key === 'Enter') doLogin(); });
    </script>
</body>
</html>
