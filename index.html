<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>1xPartners | Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&display=swap" rel="stylesheet">
    <style>
        :root { --bg:#13151f; --card:#1c1f2e; --border:#2a2d3e; --accent:#f5a623; --green:#2ecc71; --text:#e8eaf0; --muted:#6b7094; }
        * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
        body {
            background: var(--bg);
            font-family: 'Roboto', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }
        .brand {
            text-align: center;
            margin-bottom: 40px;
        }
        .brand-logo {
            font-size: 38px;
            font-weight: 900;
            letter-spacing: 1px;
            color: var(--text);
        }
        .brand-logo span { color: var(--accent); }
        .brand-sub { font-size: 13px; color: var(--muted); margin-top: 6px; letter-spacing: 2px; text-transform: uppercase; }
        .login-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 28px 24px;
            width: 100%;
            max-width: 420px;
        }
        .login-title { font-size: 20px; font-weight: 700; margin-bottom: 24px; color: var(--text); }
        .form-group { margin-bottom: 16px; }
        .form-label { display: block; font-size: 11px; color: var(--muted); font-weight: 500; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 8px; }
        .form-input {
            width: 100%;
            background: #0e1018;
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 15px 16px;
            color: var(--text);
            font-size: 16px;
            font-family: inherit;
            transition: border-color 0.2s;
        }
        .form-input:focus { outline: none; border-color: var(--accent); }
        .login-btn {
            width: 100%;
            background: var(--accent);
            color: #0a0c12;
            border: none;
            border-radius: 12px;
            padding: 16px;
            font-weight: 900;
            font-size: 16px;
            letter-spacing: 0.5px;
            cursor: pointer;
            margin-top: 8px;
            transition: opacity 0.15s;
        }
        .login-btn:active { opacity: 0.85; }
        .error-msg {
            background: rgba(231,76,60,0.12);
            border: 1px solid rgba(231,76,60,0.3);
            border-radius: 10px;
            color: #e74c3c;
            font-size: 13px;
            text-align: center;
            padding: 12px;
            margin-top: 16px;
            display: none;
        }
        .lock-icon { text-align: center; margin-bottom: 20px; }
        .lock-circle {
            width: 64px; height: 64px;
            border-radius: 50%;
            background: rgba(245,166,35,0.1);
            border: 2px solid rgba(245,166,35,0.3);
            display: flex; align-items: center; justify-content: center;
            margin: 0 auto 16px;
        }
    </style>
</head>
<body>
    <div class="brand">
        <div class="brand-logo">1x<span>Partners</span></div>
        <div class="brand-sub">Partner Portal</div>
    </div>

    <div class="login-card">
        <div class="lock-icon">
            <div class="lock-circle">
                <svg width="28" height="28" viewBox="0 0 24 24" fill="#f5a623"><path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/></svg>
            </div>
        </div>
        <div class="login-title">Admin Login</div>
        <div class="form-group">
            <label class="form-label">Username</label>
            <input type="text" id="username" class="form-input" placeholder="Enter username" autocomplete="username">
        </div>
        <div class="form-group">
            <label class="form-label">Password</label>
            <input type="password" id="password" class="form-input" placeholder="••••••••" autocomplete="current-password">
        </div>
        <button class="login-btn" id="loginBtn">SIGN IN</button>
        <div id="errorMsg" class="error-msg">❌ Invalid credentials. Access denied.</div>
    </div>

    <script>
        // --- Helper: check if already logged in ---
        function isAuthenticated() {
            const session = localStorage.getItem('1xpartners_session');
            if (!session) return false;
            try {
                const decoded = atob(session);
                const [user, pass] = decoded.split(':');
                return (user === 'prasanna' && pass === 'root@knocker') ||
                       (user === 'knocker' && pass === 'root@knocker');
            } catch(e) { return false; }
        }

        // If already logged in, go straight to dashboard
        if (isAuthenticated()) {
            window.location.replace('1xpartners-dashboard.html');
        }

        // --- Login logic ---
        function doLogin() {
            const user = document.getElementById('username').value.trim();
            const pass = document.getElementById('password').value.trim();

            // Accept both 'prasanna' and 'knocker' with same password 'root@knocker'
            if ((user === 'prasanna' || user === 'knocker') && pass === 'root@knocker') {
                localStorage.setItem('1xpartners_session', btoa(user + ':' + pass));
                localStorage.setItem('1xpartners_user', user);
                window.location.href = '1xpartners-dashboard.html';
            } else {
                const err = document.getElementById('errorMsg');
                err.style.display = 'block';
                setTimeout(() => err.style.display = 'none', 3000);
            }
        }

        document.getElementById('loginBtn').addEventListener('click', doLogin);
        document.getElementById('password').addEventListener('keypress', e => { if (e.key === 'Enter') doLogin(); });
        document.getElementById('username').addEventListener('keypress', e => { if (e.key === 'Enter') document.getElementById('password').focus(); });
    </script>
</body>
</html>
