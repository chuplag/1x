<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Admin Panel - 1xPartners</title>
    <link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@400;500;600;700&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body { background: #0a0c12; font-family: 'Exo 2', sans-serif; color: #e8eaf0; padding: 20px; }
        .admin-container { max-width: 1200px; margin: 0 auto; }
        .admin-header { background: #121520; border-radius: 16px; padding: 20px; margin-bottom: 20px; border: 1px solid #252a3a; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; }
        .btn { background: #f5a623; border: none; padding: 8px 16px; border-radius: 8px; font-weight: 600; cursor: pointer; margin: 5px; }
        .btn-outline { background: transparent; border: 1px solid #252a3a; color: #e8eaf0; }
        .card { background: #121520; border-radius: 16px; padding: 20px; margin-bottom: 20px; border: 1px solid #252a3a; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 10px; text-align: left; border-bottom: 1px solid #252a3a; }
        .form-group { margin-bottom: 15px; }
        .form-input, .form-select { width: 100%; padding: 10px; background: #0a0c12; border: 1px solid #252a3a; border-radius: 8px; color: white; }
    </style>
</head>
<body>
<div class="admin-container">
    <div class="admin-header">
        <h2>🔐 Admin Control Panel</h2>
        <div><button class="btn" onclick="location.href='1xpartners-dashboard.html'">← Back to Home</button><button class="btn btn-outline" onclick="logout()">Logout</button></div>
    </div>
    <div class="card"><h3>Agent Management</h3><button class="btn" id="addAgentBtn">+ Add Agent</button><div id="agentsList"></div></div>
    <div class="card"><h3>Adjust Agent Balance</h3><div class="form-group"><label>Agent</label><select id="balanceAgentId" class="form-select"></select></div><div class="form-group"><label>New Balance (NPR)</label><input type="number" id="newBalance" class="form-input"></div><div class="form-group"><label>Reason</label><input type="text" id="balanceReason" class="form-input"></div><button class="btn" id="adjustBalanceBtn">Update Balance</button></div>
</div>
<script src="data-manager.js"></script>
<script>
    requireAuth();
    if (localStorage.getItem('1xpartners_user') !== 'knocker') { alert('Admin only'); window.location='index.html'; }
    async function loadAgents() {
        const agents = await getAgents();
        const container = document.getElementById('agentsList');
        container.innerHTML = `<table><th>ID</th><th>Name</th><th>Email</th><th>Balance</th></tr>` + agents.map(a => `<tr><td>${a.id}</td><td>${a.name}</td><td>${a.email}</td><td>रु ${a.balance.toLocaleString('en-IN')}</td></tr>`).join('') + `</table>`;
        const select = document.getElementById('balanceAgentId');
        select.innerHTML = agents.map(a => `<option value="${a.id}">${a.name}</option>`).join('');
    }
    document.getElementById('addAgentBtn').onclick = async () => {
        const name = prompt('Name'); const email = prompt('Email');
        if(name && email) { await addAgent({ name, email, balance:0 }); loadAgents(); }
    };
    document.getElementById('adjustBalanceBtn').onclick = async () => {
        const agentId = parseInt(document.getElementById('balanceAgentId').value);
        const newBalance = parseFloat(document.getElementById('newBalance').value);
        const reason = document.getElementById('balanceReason').value;
        if(isNaN(newBalance) || !reason) alert('Fill all');
        else { await updateAgentBalance(agentId, newBalance, reason, 'Admin'); alert('Updated'); loadAgents(); }
    };
    (async()=>{ await initDB(); await generateDemoData(); await loadAgents(); })();
</script>
</body>
</html>
