<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>1xBET - Deposit & Withdrawal</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        :root {
            --bg:#0d0f1a; --card:#12141f; --border:#1e2135; --accent:#f5a623;
            --success:#22c55e; --danger:#ef4444; --text:#e8eaf0; --muted:#9098bb;
        }
        body { background:var(--bg); font-family:'Exo 2', sans-serif; color:var(--text); display:flex; min-height:100vh; position:relative; }
        .sidebar { width:260px; flex-shrink:0; background:#13151f; border-right:1px solid var(--border); transition:transform 0.3s; z-index:1000; }
        .logo { padding:18px 20px; border-bottom:1px solid var(--border); font-size:22px; font-weight:800; color:var(--accent); }
        .logo span { color:white; }
        .nav-item { display:flex; align-items:center; gap:12px; padding:10px 20px; color:var(--muted); text-decoration:none; }
        .nav-item:hover { background:rgba(255,255,255,0.05); color:var(--text); }
        .mobile-header { display:none; background:var(--card); padding:12px 16px; justify-content:space-between; position:sticky; top:0; z-index:999; }
        .hamburger { background:none; border:none; color:var(--text); font-size:26px; cursor:pointer; }
        .overlay { position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.7); z-index:998; display:none; }
        .overlay.active { display:block; }
        .main { flex:1; padding:24px; overflow:auto; }
        .container { max-width:1400px; margin:0 auto; }
        .stats-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:16px; margin-bottom:24px; }
        .stat-card { background:var(--card); border-radius:12px; padding:16px; border:1px solid var(--border); }
        .stat-value { font-size:24px; font-weight:700; color:var(--accent); }
        .search-section { background:var(--card); border-radius:16px; padding:20px; margin-bottom:24px; }
        .form-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:16px; margin-bottom:20px; }
        .form-input, .form-select { width:100%; padding:10px; background:var(--bg); border:1px solid var(--border); border-radius:8px; color:white; }
        .btn { background:var(--accent); border:none; padding:10px 20px; border-radius:8px; font-weight:600; cursor:pointer; }
        table { width:100%; border-collapse:collapse; }
        th, td { padding:12px; text-align:left; border-bottom:1px solid var(--border); }
        @media (max-width:768px) {
            .sidebar { position:fixed; left:0; top:0; height:100%; transform:translateX(-100%); width:260px; }
            .sidebar.open { transform:translateX(0); }
            .mobile-header { display:flex; }
            .main { width:100%; padding:16px; }
        }
    </style>
</head>
<body>
<div class="main">
    <div class="container">
        <div class="stats-grid" id="statsGrid"></div>
        <div class="search-section">
            <h3>Manual Transaction Entry</h3>
            <div class="form-grid">
                <input type="number" id="playerId" class="form-input" placeholder="Player ID (e.g., 1621151391)" value="1621151391">
                <input type="number" id="amount" class="form-input" placeholder="Amount (NPR)" value="1000">
                <select id="type" class="form-select">
                    <option value="Deposit">Deposit</option>
                    <option value="Withdrawal">Withdrawal</option>
                </select>
                <select id="method" class="form-select">
                    <option>eSewa</option>
                    <option>Khalti</option>
                    <option>ConnectIPS</option>
                    <option>Bank Transfer</option>
                </select>
                <select id="agentId" class="form-select"></select>
            </div>
            <button class="btn" id="recordBtn">Record Transaction</button>
        </div>
        <div class="table-responsive">
            <table>
                <thead>
                    <tr><th>Timestamp</th><th>Player ID</th><th>Amount</th><th>Type</th><th>Method</th><th>Agent</th></tr>
                </thead>
                <tbody id="txBody"></tbody>
            </table>
        </div>
    </div>
</div>

<script src="data-manager.js"></script>
<script src="nav.js"></script>
<script>
    requireAuth();
    let agents = [];

    async function loadData() {
        await initDB();
        await generateDemoData();
        agents = await getAgents();
        const select = document.getElementById('agentId');
        if (agents.length > 0) {
            select.innerHTML = agents.map(a => `<option value="${a.id}">${a.name}</option>`).join('');
            // Auto-select first agent (fixes "Fill all fields" issue)
            select.value = agents[0].id;
        } else {
            select.innerHTML = '<option value="">No agents available</option>';
        }

        const transactions = await getTransactions();
        const deposits = transactions.filter(t => t.type === 'Deposit' && t.status === 'SUCCESS');
        const withdrawals = transactions.filter(t => t.type === 'Withdrawal' && t.status === 'SUCCESS');
        const totalDep = deposits.reduce((s, t) => s + t.amount, 0);
        const totalWit = withdrawals.reduce((s, t) => s + t.amount, 0);

        document.getElementById('statsGrid').innerHTML = `
            <div class="stat-card"><div class="stat-value">रु ${totalDep.toLocaleString('en-IN')}</div><div>Total Deposits</div></div>
            <div class="stat-card"><div class="stat-value">रु ${totalWit.toLocaleString('en-IN')}</div><div>Total Withdrawals</div></div>
        `;

        const agentMap = new Map(agents.map(a => [a.id, a.name]));
        document.getElementById('txBody').innerHTML = transactions.slice(0, 50).map(tx => `
            <tr>
                <td>${new Date(tx.timestamp).toLocaleString()}</td>
                <td>${tx.playerId}</td>
                <td style="color:${tx.type === 'Deposit' ? '#22c55e' : '#f5a623'}">रु ${tx.amount.toLocaleString('en-IN')}</td>
                <td>${tx.type}</td>
                <td>${tx.method}</td>
                <td>${agentMap.get(tx.agentId) || 'N/A'}</td>
            </tr>
        `).join('');
    }

    async function addTransactionHandler() {
        const playerId = document.getElementById('playerId').value.trim();
        const amount = parseFloat(document.getElementById('amount').value);
        const type = document.getElementById('type').value;
        const method = document.getElementById('method').value;
        const agentId = parseInt(document.getElementById('agentId').value);

        // Specific error messages
        if (!playerId) {
            alert('❌ Player ID is required');
            return;
        }
        if (isNaN(amount) || amount <= 0) {
            alert('❌ Please enter a valid amount (greater than 0)');
            return;
        }
        if (amount > 70000) {
            alert('❌ Amount cannot exceed 70,000 NPR');
            return;
        }
        if (!agentId || isNaN(agentId)) {
            alert('❌ Please select an agent');
            return;
        }

        const txId = 'TX' + Math.random().toString(36).substring(2, 10).toUpperCase();
        await addTransaction({
            playerId,
            amount,
            type,
            method,
            agentId,
            status: 'SUCCESS',
            timestamp: new Date().toISOString(),
            txId
        });

        alert(`✅ ${type} of रु ${amount.toLocaleString('en-IN')} recorded successfully!`);
        
        // Clear only amount field, keep player ID and agent as they are for convenience
        document.getElementById('amount').value = '';
        loadData(); // refresh table & stats
    }

    document.getElementById('recordBtn').addEventListener('click', addTransactionHandler);
    
    // Also allow Enter key on amount field
    document.getElementById('amount').addEventListener('keypress', (e) => {
        if (e.key === 'Enter') addTransactionHandler();
    });

    loadData();
    initNav();
</script>
</body>
</html>
