<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>1xPartners - Home</title>
    <link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@400;500;600;700;800&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            background: #0a0c12;
            font-family: 'Exo 2', sans-serif;
            color: #e8eaf0;
            padding-bottom: 70px;
        }
        /* Top Bar */
        .app-top-bar {
            background: #121520;
            padding: 14px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #252a3a;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .user-name { font-weight: 700; font-size: 18px; color: #f5a623; }
        .aff-id { font-size: 12px; color: #9095aa; margin-top: 4px; }
        .icon-btn { background: none; border: none; font-size: 20px; cursor: pointer; color: #9095aa; }
        
        /* Main Content */
        .main { padding: 20px; max-width: 600px; margin: 0 auto; }
        
        /* Stats Card */
        .stats-card {
            background: #121520;
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 20px;
            border: 1px solid #252a3a;
            text-align: center;
        }
        .stats-label { font-size: 13px; color: #9095aa; text-transform: uppercase; letter-spacing: 0.5px; }
        .stats-amount { font-family: 'Rajdhani', sans-serif; font-size: 36px; font-weight: 700; color: #f5a623; margin: 8px 0; }
        
        /* Link Generation Card */
        .link-card {
            background: #121520;
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 20px;
            border: 1px solid #252a3a;
        }
        .link-title { font-weight: 600; margin-bottom: 12px; color: #f5a623; }
        .link-input { width: 100%; background: #0a0c12; border: 1px solid #252a3a; border-radius: 10px; padding: 12px; color: white; font-size: 14px; }
        .btn { background: #f5a623; border: none; padding: 10px 20px; border-radius: 10px; font-weight: 600; margin-top: 10px; cursor: pointer; width: 100%; }
        
        /* Summary Grid */
        .summary-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 20px;
        }
        .summary-item {
            background: #121520;
            border-radius: 12px;
            padding: 16px;
            text-align: center;
            border: 1px solid #252a3a;
        }
        .summary-icon { font-size: 24px; margin-bottom: 8px; }
        .summary-value { font-family: 'Rajdhani', sans-serif; font-size: 22px; font-weight: 700; color: #f5a623; }
        .summary-label { font-size: 11px; color: #9095aa; margin-top: 4px; }
        
        /* Period Selector */
        .period-selector {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }
        .period-btn {
            background: transparent;
            border: 1px solid #252a3a;
            padding: 8px 16px;
            border-radius: 20px;
            color: #9095aa;
            font-size: 12px;
            cursor: pointer;
        }
        .period-btn.active {
            background: #f5a623;
            color: #0a0c12;
            border-color: #f5a623;
        }
        
        /* Bottom Navigation */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: #121520;
            display: flex;
            justify-content: space-around;
            padding: 10px 0 16px;
            border-top: 1px solid #252a3a;
            z-index: 100;
        }
        .bottom-nav .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-decoration: none;
            color: #9095aa;
            font-size: 11px;
            gap: 4px;
        }
        .bottom-nav .nav-item.active { color: #f5a623; }
        .nav-icon { font-size: 22px; }
        
        @media (max-width: 480px) {
            .main { padding: 16px; }
            .stats-amount { font-size: 28px; }
        }
    </style>
</head>
<body>
<div class="main">
    <!-- Available to withdraw card -->
    <div class="stats-card">
        <div class="stats-label">Available to withdraw</div>
        <div class="stats-amount" id="availableAmount">रु 0</div>
    </div>
    
    <!-- Link Generation -->
    <div class="link-card">
        <div class="link-title">🔗 Link generation</div>
        <input type="text" class="link-input" id="affLink" readonly value="https://1xpartners.com/aff/4101738">
        <button class="btn" onclick="copyLink()">Copy link</button>
    </div>
    
    <!-- Brief summary -->
    <div class="period-selector" id="periodSelector">
        <button class="period-btn" data-period="today">Today</button>
        <button class="period-btn" data-period="yesterday">Yesterday</button>
        <button class="period-btn active" data-period="month">Current month</button>
        <button class="period-btn" data-period="lastmonth">Last month</button>
        <button class="period-btn" data-period="all">For all time</button>
    </div>
    
    <div class="summary-grid" id="summaryGrid">
        <div class="summary-item"><div class="summary-icon">⭐</div><div class="summary-value" id="depositCount">0</div><div class="summary-label">Number of deposits</div></div>
        <div class="summary-item"><div class="summary-icon">🛒</div><div class="summary-value" id="regCount">0</div><div class="summary-label">Registrations</div></div>
        <div class="summary-item"><div class="summary-icon">↗</div><div class="summary-value" id="directCount">0</div><div class="summary-label">Direct links</div></div>
        <div class="summary-item"><div class="summary-icon">💵</div><div class="summary-value" id="commissionAmount">रु 0</div><div class="summary-label">Commission</div></div>
    </div>
</div>

<script src="data-manager.js"></script>
<script src="nav.js"></script>
<script>
    let currentPeriod = 'month';
    
    async function loadStats() {
        await initDB();
        const transactions = await getTransactions();
        const deposits = transactions.filter(t => t.type === 'Deposit' && t.status === 'SUCCESS');
        
        const now = new Date();
        const todayStart = new Date(now.setHours(0,0,0,0));
        const yesterdayStart = new Date(todayStart);
        yesterdayStart.setDate(yesterdayStart.getDate() - 1);
        const monthStart = new Date(now.getFullYear(), now.getMonth(), 1);
        const lastMonthStart = new Date(now.getFullYear(), now.getMonth() - 1, 1);
        const lastMonthEnd = new Date(now.getFullYear(), now.getMonth(), 0);
        
        let filtered = [];
        if (currentPeriod === 'today') filtered = deposits.filter(t => new Date(t.timestamp) >= todayStart);
        else if (currentPeriod === 'yesterday') filtered = deposits.filter(t => {
            const d = new Date(t.timestamp);
            return d >= yesterdayStart && d < todayStart;
        });
        else if (currentPeriod === 'month') filtered = deposits.filter(t => new Date(t.timestamp) >= monthStart);
        else if (currentPeriod === 'lastmonth') filtered = deposits.filter(t => {
            const d = new Date(t.timestamp);
            return d >= lastMonthStart && d <= lastMonthEnd;
        });
        else filtered = deposits;
        
        const totalAmount = filtered.reduce((s,t) => s + t.amount, 0);
        const uniquePlayers = new Set(filtered.map(t => t.playerId)).size;
        // For demo, direct links = unique players, commission = totalAmount * 0.3 (example)
        const commission = totalAmount * 0.3;
        
        document.getElementById('availableAmount').innerText = formatCurrency(totalAmount);
        document.getElementById('depositCount').innerText = filtered.length;
        document.getElementById('regCount').innerText = uniquePlayers;
        document.getElementById('directCount').innerText = uniquePlayers;
        document.getElementById('commissionAmount').innerText = formatCurrency(commission);
    }
    
    function formatCurrency(amt) { return 'रु ' + Math.round(amt).toLocaleString('en-IN'); }
    
    function copyLink() {
        const link = document.getElementById('affLink');
        link.select();
        document.execCommand('copy');
        alert('Link copied!');
    }
    
    // Period buttons
    document.querySelectorAll('.period-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            document.querySelectorAll('.period-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            currentPeriod = btn.dataset.period;
            loadStats();
        });
    });
    
    requireAuth();
    loadStats();
    initNav();
</script>
</body>
</html>
