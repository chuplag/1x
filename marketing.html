<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>PROMO - 1xPartners</title>
    <link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@400;500;600;700&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body { background: #0a0c12; font-family: 'Exo 2', sans-serif; color: #e8eaf0; padding-bottom: 70px; }
        .app-top-bar { background: #121520; padding: 14px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #252a3a; }
        .user-name { font-weight: 700; font-size: 18px; color: #f5a623; }
        .aff-id { font-size: 12px; color: #9095aa; margin-top: 4px; }
        .main { padding: 20px; max-width: 600px; margin: 0 auto; }
        .menu-card { background: #121520; border-radius: 16px; border: 1px solid #252a3a; overflow: hidden; }
        .menu-item { display: flex; align-items: center; gap: 16px; padding: 16px 20px; border-bottom: 1px solid #252a3a; text-decoration: none; color: #e8eaf0; }
        .menu-item:last-child { border-bottom: none; }
        .menu-icon { font-size: 24px; }
        .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: #121520; display: flex; justify-content: space-around; padding: 10px 0 16px; border-top: 1px solid #252a3a; }
        .bottom-nav .nav-item { display: flex; flex-direction: column; align-items: center; text-decoration: none; color: #9095aa; font-size: 11px; gap: 4px; }
        .bottom-nav .nav-item.active { color: #f5a623; }
        .nav-icon { font-size: 22px; }
    </style>
</head>
<body>
<div class="main">
    <div class="menu-card">
        <a href="#" class="menu-item"><span class="menu-icon">📱</span><span class="menu-label">My sources</span></a>
        <a href="#" class="menu-item"><span class="menu-icon">🔗</span><span class="menu-label">Affiliate links</span></a>
        <a href="#" class="menu-item"><span class="menu-icon">🎫</span><span class="menu-label">Promo codes</span></a>
        <a href="#" class="menu-item"><span class="menu-icon">📸</span><span class="menu-label">Promotional materials</span></a>
    </div>
</div>
<script src="data-manager.js"></script>
<script src="nav.js"></script>
<script>
    requireAuth();
    initNav();
    document.querySelectorAll('.bottom-nav .nav-item')[2].classList.add('active');
</script>
</body>
</html>
